[package]
name = "nexus"
default-run = "nexus"
version = "0.1.0"
description = "NEXUS, assistant personnel intelligent pour Windows"
license = "MIT"
edition = "2021"
rust-version = "1.97"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
thiserror = "2"
tract-onnx = "0.23"
whisper-rs = "0.16"
cpal = "0.18"
hound = "3.5"
tauri-plugin-global-shortcut = "2"
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.10"
walkdir = "2"
trash = "5"
dirs = "6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dxgi_Common", "Win32_System_Power"] }

[dev-dependencies]
wat = "1.243.0"
