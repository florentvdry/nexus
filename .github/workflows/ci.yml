name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (TypeScript, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  native:
    name: Windows (Rust tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      # Le SDK des plugins WebAssembly et son exemple doivent compiler et passer leurs tests.
      - run: cargo test
        working-directory: sdk/nexus-plugin-sdk
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: examples/plugins/community.exemple.convertisseur
      # Le validateur officiel contrôle les exemples livrés : un paquet cassé fait échouer la CI.
      - run: cargo run --bin nexus-plugin -- validate ../examples/plugins/community.exemple.verbes
      - run: cargo run --bin nexus-plugin -- validate ../examples/plugins/community.exemple.convertisseur

  desktop:
    name: Windows (build de l'application)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Compile le frontend et l'application complète, liaison comprise : le binaire doit démarrer sur Windows.
      - run: pnpm tauri build --debug --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-debug
          path: src-tauri/target/debug/nexus.exe
          if-no-files-found: error
